# Explicit local-only defaults for the documented Docker Compose and IDE demo.
# Do not activate this profile in shared, staging, or production environments.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartkb
    username: smartkb
    password: smartkb123

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: smartkb
    password: smartkb123

  ai:
    openai:
      api-key: ${TRANSIT_API_KEY:${OPENAI_API_KEY:local-demo-api-key}}

management:
  tracing:
    sampling:
      probability: 1.0
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.smartkb: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.jdbc: DEBUG

smartkb:
  object-storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:smartkb}
    secret-key: ${MINIO_SECRET_KEY:smartkb123}
    bucket: ${MINIO_BUCKET:smartkb-documents}
