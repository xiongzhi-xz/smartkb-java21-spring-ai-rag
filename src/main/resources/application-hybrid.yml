spring:
  application:
    name: smartkb

  # Java 25 Virtual Threads
  threads:
    virtual:
      enabled: true

  # Spring AI 配置 - 混合模式（Chat用中转站 + Embedding用本地）
  ai:
    # OpenAI 兼容接口 - 用于 Chat
    openai:
      base-url: ${TRANSIT_BASE_URL:https://api.deepseek.com}
      chat:
        enabled: true
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.7
      embedding:
        enabled: false  # 禁用 OpenAI Embedding

    # Ollama 本地模型 - 用于 Embedding
    ollama:
      base-url: http://localhost:11434
      embedding:
        enabled: true
        options:
          model: nomic-embed-text

    # pgvector 向量存储配置
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768  # nomic-embed-text 的维度
        remove-existing-vector-store-table: false
        initialize-schema: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  mvc:
    async:
      request-timeout: ${SMARTKB_ASYNC_REQUEST_TIMEOUT:120s}

# 服务器配置
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain

# 应用自定义配置
smartkb:
  document:
    max-file-size: 50MB
    allowed-extensions: pdf,docx,txt,md
    parse-concurrency: 50

  embedding:
    batch-size: 100
    concurrent-requests: 30

  rag:
    top-k: 5
    similarity-threshold: 0.7
    context-window: 4000
    refusal-threshold: ${SMARTKB_RAG_REFUSAL_THRESHOLD:0.18}

  reranker:
    enabled: ${SMARTKB_RERANKER_ENABLED:true}
    base-url: ${SMARTKB_RERANKER_BASE_URL:http://localhost:8090}
    timeout: ${SMARTKB_RERANKER_TIMEOUT:3s}
