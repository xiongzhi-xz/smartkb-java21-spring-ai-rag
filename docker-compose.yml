services:
  # PostgreSQL 16 + pgvector 扩展
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-postgres
    environment:
      POSTGRES_DB: smartkb
      POSTGRES_USER: smartkb
      POSTGRES_PASSWORD: smartkb123
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    # 不映射到宿主机，容器内部通信走 Docker 网络
    # 如需从宿主机直连：取消下行注释
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartkb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartkb-network

  # Redis - 会话记忆 + 缓存
  redis:
    image: redis:7-alpine
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-redis
    # 不映射到宿主机（容器内部通信走 Docker 网络）
    # 如需从宿主机 redis-cli 连接：取消下行注释
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - smartkb-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-rabbitmq
    ports:
      - "${SMARTKB_RABBITMQ_PORT:-5672}:5672"
      - "${SMARTKB_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: smartkb
      RABBITMQ_DEFAULT_PASS: smartkb123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartkb-network

  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z@sha256:c7175077d39a8cc10c9fd611cdcc68b6a5b365793e9ac6f4198ffff1ef0fe555
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-minio
    command: server /data --console-address ":9001"
    ports:
      - "${SMARTKB_MINIO_PORT:-9000}:9000"
      - "${SMARTKB_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: smartkb
      MINIO_ROOT_PASSWORD: smartkb123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartkb-network

  milvus:
    image: milvusdb/milvus:v2.4.8
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    ports:
      - "${SMARTKB_MILVUS_PORT:-19530}:19530"
      - "${SMARTKB_MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - smartkb-network

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      # OpenSearch 2.12+ validates this during bootstrap even with security disabled.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-SmartkbLocalAdmin123!}
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${SMARTKB_OPENSEARCH_PORT:-9200}:9200"
      - "${SMARTKB_OPENSEARCH_METRICS_PORT:-9600}:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      - smartkb-network

  reranker:
    build:
      context: ./reranker-service
      dockerfile: Dockerfile
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-reranker
    ports:
      - "${SMARTKB_RERANKER_PORT:-8090}:8090"
    environment:
      RERANKER_MODEL: BAAI/bge-reranker-v2-m3
      RERANKER_MAX_LENGTH: 1024
    gpus: all
    volumes:
      - reranker_models:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 180s
    networks:
      - smartkb-network

  # SmartKB Spring Boot 应用
  smartkb-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-app
    ports:
      - "${SMARTKB_APP_PORT:-8082}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local-demo
      # 使用 Docker 网络内部 DNS 连接 PostgreSQL 和 Redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartkb
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: smartkb
      MINIO_SECRET_KEY: smartkb123
      MINIO_BUCKET: smartkb-documents
      SMARTKB_RETRIEVAL_MILVUS_HOST: milvus
      SMARTKB_RETRIEVAL_MILVUS_PORT: 19530
      SMARTKB_RETRIEVAL_OPENSEARCH_ENDPOINT: http://opensearch:9200
      # Ollama 在宿主机运行，容器内通过 host.docker.internal 访问
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # AI 模型配置（通过环境变量注入，不硬编码）
      TRANSIT_API_KEY: ${TRANSIT_API_KEY:?Set TRANSIT_API_KEY in .env before starting SmartKB}
      TRANSIT_BASE_URL: ${TRANSIT_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      SMARTKB_RERANKER_BASE_URL: http://reranker:8090
      SMARTKB_RERANKER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      reranker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - smartkb-network

  # Prometheus - 指标采集
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-prometheus
    # 不映射到宿主机，Grafana 通过 Docker 网络访问
    # 容器内部 Grafana 可通过 http://prometheus:9090 访问
    # 如需从宿主机浏览器访问：取消下行注释
    # ports:
    #   - "9091:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - smartkb-app
    networks:
      - smartkb-network

  # Grafana - 可视化
  grafana:
    image: grafana/grafana:10.4.3
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-grafana
    ports:
      - "${SMARTKB_GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - smartkb-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  reranker_models:
  rabbitmq_data:
  minio_data:
  milvus_data:
  opensearch_data:

networks:
  smartkb-network:
    driver: bridge
