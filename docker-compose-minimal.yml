services:
  # PostgreSQL 16 + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-postgres
    environment:
      POSTGRES_DB: smartkb
      POSTGRES_USER: smartkb
      POSTGRES_PASSWORD: smartkb123
    ports:
      - "${SMARTKB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartkb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-redis
    ports:
      - "${SMARTKB_REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z@sha256:c7175077d39a8cc10c9fd611cdcc68b6a5b365793e9ac6f4198ffff1ef0fe555
    container_name: ${SMARTKB_CONTAINER_PREFIX:-smartkb}-minio
    command: server /data --console-address ":9001"
    ports:
      - "${SMARTKB_MINIO_PORT:-9000}:9000"
      - "${SMARTKB_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: smartkb
      MINIO_ROOT_PASSWORD: smartkb123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
